set -g default-command "env -i HOME=/tmp TERM=tmux-256color PATH=/opt/homebrew/bin:/usr/bin:/bin PS1='$ ' bash --norc --noprofile"
set -sg escape-time 300
set -g default-terminal tmux-256color
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[bg=#f9e2af,fg=#1e1e2e,bold] yanker #[default] "
set -g status-right "#[fg=#f9e2af]M-y#[fg=#a6adc8] or #[fg=#f9e2af]prefix Y#[fg=#a6adc8] to yank lines "
set -g window-status-current-format ""
set -g window-status-format ""
set -g message-style "bg=#a6e3a1,fg=#1e1e2e,bold"
set -g @yanker-root-key M-y
set -g @yanker-copy-command "cat >/dev/null"
run-shell "$PWD/yanker.tmux"
